[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avp-client"
version = "1.0.0"
description = "Agent Vault Protocol Python SDK"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["avp_client*"]

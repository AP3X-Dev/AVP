[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avp-server"
version = "1.0.0"
description = "Agent Vault Protocol reference server"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # docs/schemas/ are generated from these models; pin the minor so schema
    # generation is reproducible across environments (drift guard in tests)
    "pydantic>=2.9.2,<2.10",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "cryptography>=43",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
aws = [
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
include = ["avp_server*"]

[tool.setuptools.package-data]
avp_server = ["static/*.html"]

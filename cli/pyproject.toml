[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avp-cli"
version = "1.0.0"
description = "Agent Vault Protocol CLI"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
]

[project.scripts]
avp = "avp_cli.main:app"

[tool.setuptools.packages.find]
include = ["avp_cli*"]

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter (ruff)
        working-directory: server
        run: ruff check avp_server --ignore=E501,F401

      - name: Run tests
        working-directory: server
        env:
          AVP_DEV_MODE: "true"
          AVP_ALLOW_EPHEMERAL_DEK: "true"
        run: pytest avp_server/tests/ -v --tb=short

  lint-cli:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install CLI dependencies
        working-directory: cli
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check CLI imports
        working-directory: cli
        run: python -c "from avp_cli.main import app; print('CLI imports OK')"

  lint-sdk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install SDK
        working-directory: sdk-python
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Check SDK imports
        working-directory: sdk-python
        run: python -c "from avp_client.client import AVPClient; print('SDK imports OK')"

  conformance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: avp
          POSTGRES_PASSWORD: avp
          POSTGRES_DB: avp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install server
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Start vault
        working-directory: server
        env:
          AVP_DATABASE_URL: postgresql://avp:avp@localhost:5432/avp
          AVP_DEV_MODE: "true"
          AVP_KEY_VERSION: ci-1
        run: |
          export AVP_DEK_B64=$(python -c "import base64,os;print(base64.urlsafe_b64encode(os.urandom(32)).decode())")
          nohup python -m uvicorn avp_server.main:app --port 8000 > /tmp/vault.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/healthz && break; sleep 1; done
          curl -sf http://localhost:8000/healthz || (cat /tmp/vault.log; exit 1)

      - name: Run conformance suite
        run: |
          PTK=$(curl -sf -X POST http://localhost:8000/dev/bootstrap_principal \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@avp.dev","display_name":"CI"}' | python -c "import sys,json;print(json.load(sys.stdin)['principal_token'])")
          python server/scripts/conformance.py --url http://localhost:8000 --principal-token "$PTK"

      - name: Server log on failure
        if: failure()
        run: cat /tmp/vault.log

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f server/Dockerfile -t avp-server:test .
